name: Build macOS

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install frontend dependencies
        run: npm install

      - name: Generate macOS icons
        run: npx tauri icon src-tauri/icons/icon.png

      - name: Build Tauri app (universal binary)
        run: npx tauri build --target universal-apple-darwin
        env:
          TAURI_SIGNING_PRIVATE_KEY: ""
          VITE_SUPABASE_URL: "https://kqksmievwxwbfnhexcdy.supabase.co"
          VITE_SUPABASE_ANON_KEY: "sb_publishable_DR4sWS6mG1mtjmj17nk76g_ay-aIerf"

      - name: Ad-hoc sign the app
        run: |
          APP=$(find src-tauri/target/universal-apple-darwin/release/bundle/macos -name "*.app" | head -1)
          if [ -n "$APP" ]; then
            codesign --force --deep --sign - "$APP"
            echo "Ad-hoc signed: $APP"
          fi

      - name: Rename DMG for release
        run: |
          DMG=$(find src-tauri/target/universal-apple-darwin/release/bundle/dmg -name "*.dmg" | head -1)
          if [ -n "$DMG" ]; then
            cp "$DMG" "Aevum_mac.dmg"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: Aevum_mac.dmg
          if-no-files-found: error
